name: 'Rust + TypeScript setup'
description: 'Shared setup for Rust + TypeScript monorepos (cargo check, npm build, ts-rs codegen)'
inputs:
  node-version:
    description: 'Node.js version'
    default: '20'
    required: false
  rust-channel:
    description: 'Rust toolchain channel'
    default: 'stable'
    required: false
  cache-key:
    description: 'Optional cache key prefix'
    default: ''
    required: false
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.rust-channel }}

    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key || 'rust-ts' }}-${{ hashFiles('**/Cargo.lock') }}

    - run: npm ci
      shell: bash

    - run: cargo fetch
      shell: bash

    - run: cargo check --all-targets
      shell: bash

    - run: npm run build
      shell: bash

    - run: npm run codegen
      shell: bash
      if: "contains(github.event.pull_request.labels.*.name, 'ts-rs') || contains(github.event.head_commit.message, 'ts-rs')"
