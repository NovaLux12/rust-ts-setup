name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (validate composite action)
        uses: docker://docker.io/rhysd/actionlint:latest
        with:
          args: -color action/action.yml
